<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>


    let inputN = parseInt(prompt(" Nhập vào độ dài mảng:"));

    let arrayNum = [];

    for (let i = 0; i < inputN; i++) {
        arrayNum[i] = +(prompt(`Nhập phần tử thứ ${i}`));

    }
    console.log(arrayNum)

    let array = arrayNum.sort()
    console.log(array)
    let count = 0;
    for (let i = 0; i < array.length; i++) {
        if (array[i] === array[array.length - 1]) {
            count++
        }
    }
    console.log(` số lớn nhất là ${array[array.length - 1]} có số lần xuất hiện là ${count}`);
</script>
</body>
</html>
