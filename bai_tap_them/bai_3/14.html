<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    function checkString(str) {
        let countUp = 0;
        let countLow = 0;
        for (let i = 0; i < str.length; i++) {
            if ("a" <= str[i] && str[i] <= "z") {
                countLow++;
            }
            if ("A" <= str[i] && str[i] <= "Z") {
                countUp++;
            }
        }
        return countLow === countUp;
    }

    let str = "ABCabc"
    let result = checkString(str);
    console.log(result);

    function checkDate(dateString) {
        const parts = dateString.split('/');
        if (parts.length !== 3) {
            return false;
        }
        const day = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10);
        const year = parseInt(parts[2], 10);
        if (isNaN(day) || isNaN(month) || isNaN(year)) {
            return false;
        }
        if (month < 1 || month > 12) {
            return false;
        }
        return true;
    }
</script>
</body>
</html>
