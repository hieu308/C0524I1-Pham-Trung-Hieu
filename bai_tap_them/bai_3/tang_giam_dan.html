<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<script>
    let inputN = parseInt(prompt(" Nhập vào độ dài mảng:"));

    let array = [];

    for (let i = 0; i < inputN; i++) {
       array[i] = +(prompt(`Nhập phần tử thứ ${i}`));

    }
    console.log(array)

    function ascending(array) {
        for (let i = 0; i < array.length; i++) {
            if (array[i] >array[i + 1] || array[i] === array[i+1]) {
                return false;
            }
        }
        return true;
    }

    function decrease(array) {
        for (let i = 0; i < array.length; i++) {
            if (array[i] <array[i + 1] || array[i] === array[i+1]) {
                return false;
            }
        }
        return true;
    }
    ascending(array) || decrease(array)?alert("ok"):alert("false");


</script>
</body>
</html>
